# Copy this file to config.yaml and edit it.

interval_seconds: 60

# Optional — paste a Discord webhook URL to get alerted on status changes.
# Leave blank to just log to the console/database.
discord_webhook_url: ""

targets:
  - name: "My Portfolio"
    url: "https://example.com"
    timeout: 10
    expected_status: 200

  - name: "My API"
    url: "https://api.example.com/health"
    timeout: 5
    expected_status: 200
